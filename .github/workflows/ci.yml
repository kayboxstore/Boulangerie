name: Vérifications

on:
  pull_request:
  push:
    branches:
      - main
      - main-a7fm5x

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://lomoto:lomoto@localhost:5432/lomoto_ci?schema=public
      JWT_SECRET: ci-secret-uniquement-pour-les-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lomoto
          POSTGRES_PASSWORD: lomoto
          POSTGRES_DB: lomoto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Auditer les dépendances
        run: npm audit

      - name: Appliquer les migrations PostgreSQL
        run: npx prisma migrate deploy

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier et compiler
        run: npm run build

      - name: Vérification d'intégration PostgreSQL réelle du correctif P0-01 (P1-03)
        # Additif : ne remplace pas les tests unitaires mockés ci-dessus — les
        # mêmes garanties (bootstrap idempotent, permission personnalisée
        # jamais écrasée, zéro utilisateur, seed démo refusé en production,
        # base inchangée après ce refus), mais contre une vraie base
        # PostgreSQL plutôt qu'un client Prisma simulé.
        run: npx tsx scripts/verifier-integration-bootstrap-ci.ts
