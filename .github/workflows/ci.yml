name: Vérifications

on:
  pull_request:
  push:
    branches:
      - main
      - main-a7fm5x

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://lomoto:lomoto@localhost:5432/lomoto_ci?schema=public
      JWT_SECRET: ci-secret-uniquement-pour-les-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lomoto
          POSTGRES_PASSWORD: lomoto
          POSTGRES_DB: lomoto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Auditer les dépendances
        run: npm audit

      - name: Appliquer les migrations PostgreSQL
        run: npx prisma migrate deploy

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier et compiler
        run: npm run build

      - name: Vérification d'intégration PostgreSQL réelle du correctif P0-01 (round 4)
        # Additif : ne remplace pas les tests unitaires mockés ci-dessus — les
        # mêmes garanties (bootstrap idempotent, permission personnalisée
        # jamais écrasée/recréée, hiérarchie de rôle jamais réécrite, rollback
        # réel sur échec, zéro utilisateur à chaque étape, seed démo refusé en
        # production — message précis vérifié —, base inchangée après ce
        # refus, VRAI chemin `npm run db:bootstrap:production`), mais contre
        # une vraie base PostgreSQL plutôt qu'un client Prisma simulé.
        #
        # CI_INTEGRATION_BOOTSTRAP_CONFIRME=true : confirmation explicite
        # propre à ce script (round 3, point 3) — ce script effectue de
        # VRAIES écritures destructives volontaires (modification/suppression
        # de permission, échec de transaction injecté). Sa garde
        # (scripts/garde-integration-ci.ts) exige EN PLUS que DATABASE_URL
        # pointe vers un hôte local et la base exacte `lomoto_ci` définie
        # ci-dessus (`env.DATABASE_URL`, service `postgres`) — jamais une
        # base de développement réelle, jamais un hôte distant.
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-integration-bootstrap-ci.ts

      - name: Vérification de concurrence PostgreSQL réelle du correctif P0-01 (round 6, point 1)
        # Additif, distinct du script ci-dessus : prouve l'atomicité des
        # écritures de PUT /api/equipe/:id/activation et
        # POST /api/equipe/:id/principal sous une VRAIE concurrence
        # PostgreSQL (deux connexions séparées, Promise.allSettled, un
        # crochet de test qui élargit délibérément la fenêtre de course pour
        # un scénario déterministe) — jamais un Administrateur Principal
        # inactif, jamais deux Principaux, rollback réel vérifié. Même garde
        # que le script précédent (hôte local + base exacte `lomoto_ci` +
        # confirmation explicite).
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-concurrence-equipe-ci.ts

      - name: Vérification PostgreSQL réelle du correctif P1 — piste d'audit de MODIFIER_PERMISSIONS_ROLE (contre-revue Codex 24/08/2026)
        # Additif, distinct des deux scripts ci-dessus : prouve que l'action
        # critique MODIFIER_PERMISSIONS_ROLE écrit désormais une piste
        # d'audit complète (état avant/après COMPLET et déterministe,
        # diff ajouts/retraits/modifications, identité de l'acteur et du
        # demandeur d'origine) DANS LA MÊME transaction PostgreSQL que les
        # écritures RolePermission — avec deux preuves de ROLLBACK réel
        # (échec d'une écriture de permission, échec de l'écriture d'audit
        # elle-même) relues depuis une connexion séparée. Les tests unitaires
        # mockés (apps/api/src/services/permissionsRoleAudit.test.ts)
        # prouvent la logique ; seule une vraie base PostgreSQL peut prouver
        # un vrai ROLLBACK. Même garde que les deux scripts précédents (hôte
        # local + base exacte `lomoto_ci` + confirmation explicite).
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-audit-permissions-role-ci.ts

      - name: Vérification HTTP réelle du correctif P2-01 — parcours complet de MODIFIER_PERMISSIONS_ROLE (Round 3, contre-revue Codex 24/08/2026)
        # Additif, distinct des scripts ci-dessus : ceux-ci prouvent la
        # logique de service contre PostgreSQL, mais pas le parcours HTTP
        # complet — celui-ci exerce le VRAI routeur Express (rolesRouter,
        # approbationsRouter), servi par supertest, avec une VRAIE
        # authentification JWT (aucun mock d'auth ni de Prisma) : parcours
        # direct (PUT /api/roles/:id/permissions par l'Admin Principal) et
        # parcours approbation (soumission par un Admin secondaire, puis
        # POST /api/approbations/:id/approuver par le Principal), avec
        # relecture Prisma indépendante après chaque appel HTTP. Même garde
        # que les scripts précédents (hôte local + base exacte lomoto_ci +
        # confirmation explicite).
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-http-permissions-role-ci.ts

      - name: Vérification HTTP réelle du correctif P1 — parcours complet des 4 autres actions critiques (mission « atomicité exécution métier », 25/08/2026)
        # Additif, distinct des scripts ci-dessus : mêmes garanties que le
        # script HTTP réel de MODIFIER_PERMISSIONS_ROLE, mais pour les 4
        # AUTRES types d'action critique (SUPPRIMER_UTILISATEUR,
        # CREER_COMPTE_ADMIN, MODIFIER_TYPE_CLIENT, MODIFIER_TAUX_TAXE) —
        # VRAI routeur Express (equipeRouter, clients.ts/typeClientsRouter,
        # produitsRouter, approbationsRouter), servi par supertest, VRAIE
        # authentification JWT (aucun mock d'auth ni de Prisma), parcours
        # direct ET parcours approbation pour chacun des 4 types, avec
        # relecture Prisma indépendante après chaque appel HTTP. Même garde
        # que les scripts précédents.
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-http-actions-metier-ci.ts

      - name: Vérification de concurrence PostgreSQL réelle du correctif P1 — atomicité des 4 autres actions critiques (mission « atomicité exécution métier », 25/08/2026)
        # Additif, distinct des scripts ci-dessus : prouve, contre une VRAIE
        # base PostgreSQL et avec la même méthodologie que
        # verifier-audit-permissions-role-ci.ts (scénarios 10-13 — pid réel
        # capturé DEPUIS chaque transaction via pg_backend_pid(), blocage
        # RÉELLEMENT observé depuis une troisième connexion via
        # pg_blocking_pids, jamais un délai comme preuve), que la réservation
        # de la DemandeApprobation, l'exécution métier des 4 autres types
        # d'action critique, ET la transition finale sont désormais
        # ENSEMBLE, dans UNE SEULE transaction PostgreSQL Serializable :
        # deux approbations concurrentes sur la même demande, approbation vs
        # rejet concurrents (les deux issues), chacun rejoué 10 fois sans
        # instabilité — PLUS trois preuves de ROLLBACK réel complet
        # (SUPPRIMER_UTILISATEUR sur une violation de clé étrangère RÉELLE,
        # CREER_COMPTE_ADMIN avec le rattachement Travailleur INCLUS,
        # MODIFIER_TYPE_CLIENT et MODIFIER_TAUX_TAXE). Même garde que les
        # scripts précédents.
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-concurrence-actions-metier-ci.ts

      - name: Vérification PostgreSQL réelle du correctif « suppression de matière bloquée par une recette orpheline » (27/08/2026)
        # Additif, distinct des scripts ci-dessus : constat de production
        # (Farine/Levure impossibles à supprimer même après réinitialisation
        # complète de la base) — prouve contre une VRAIE contrainte de clé
        # étrangère PostgreSQL que la cause (IngredientRecette résiduelle,
        # table morte depuis la refonte 3.3) bloque réellement la
        # suppression, et que la purger (migration
        # 20260827120333_purger_recettes_orphelines, et l'ajout correspondant
        # dans reinitialiserBase()) débloque réellement la matière. Le test
        # mocké routes/stocks.matieres.test.ts prouve séparément que la route
        # HTTP traduit ce P2003 en 409 explicite plutôt qu'un 500 générique.
        # Même garde que les scripts précédents.
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-purge-recettes-orphelines-ci.ts

      - name: Vérification PostgreSQL réelle de l'APPLICATION de la migration purge à des données pré-existantes (contre-revue Codex 28/08/2026)
        # Additif, distinct du script ci-dessus : celui-ci prouve le mécanisme
        # (CASCADE) en appelant directement recette.deleteMany() sur une base
        # déjà entièrement migrée — il ne prouve pas que la VRAIE migration
        # `20260827120333_purger_recettes_orphelines`, appliquée par
        # `prisma migrate deploy` à une base qui la précède encore, purge
        # réellement des données pré-existantes (le scénario réel de
        # production). Ce script comble cet écart : schéma PostgreSQL isolé
        # migré à l'état exact précédant le correctif (36 migrations),
        # données « historiques » insérées, PUIS vraie exécution de
        # `prisma migrate deploy` (processus enfant) pour la 37e — avec
        # témoin de non-régression (une matière sans lien à Recette reste
        # strictement intacte) et preuve explicite qu'aucune connexion
        # PostgreSQL ne subsiste après coup, y compris en cas d'échec. Même
        # garde que les scripts précédents (hôte local + base exacte
        # lomoto_ci + confirmation explicite).
        env:
          CI_INTEGRATION_BOOTSTRAP_CONFIRME: "true"
        run: npx tsx scripts/verifier-application-reelle-migration-purge-recettes-ci.ts

  garde-seed-demo-windows:
    name: Garde du seed démo — preuve réelle sous Windows (round 4, point 1)
    runs-on: windows-latest
    timeout-minutes: 10
    # Aucun service PostgreSQL ici : la garde (garde-environnement-seed-demo.ts)
    # doit refuser sur NODE_ENV AVANT toute tentative de connexion à
    # DATABASE_URL — cette URL n'a donc besoin d'être ni réelle ni jamais
    # contactée, seulement présente et syntaxiquement locale.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/lomoto_windows_ci_factice
      NODE_ENV: production
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma (types nécessaires à seed-demo.ts)
        run: npx prisma generate

      - name: npm run db:seed:demo doit réellement échouer sous Windows avec NODE_ENV=production
        # round 4, point 1 : la version round 3 résolvait puis exécutait
        # node_modules/.bin/prisma.cmd via spawnSync SANS shell — un .cmd
        # n'est pas un exécutable natif Windows, ceci échouait silencieusement
        # d'une manière que les tests (Linux uniquement jusqu'ici) ne
        # pouvaient pas détecter. Preuve directe, sur une vraie machine
        # Windows : exit non nul ET message précis de la garde, pas
        # n'importe quel échec (qui pourrait aussi bien venir d'un binaire
        # introuvable que de la garde elle-même).
        shell: pwsh
        run: |
          $sortie = npm run db:seed:demo 2>&1 | Out-String
          Write-Host $sortie
          if ($LASTEXITCODE -eq 0) {
            Write-Error "npm run db:seed:demo a RÉUSSI avec NODE_ENV=production sous Windows — ne doit JAMAIS arriver"
            exit 1
          }
          if ($sortie -notmatch 'NODE_ENV="production"') {
            Write-Error "npm run db:seed:demo a échoué (attendu) mais SANS le message précis de la garde (NODE_ENV=`"production`") — voir la sortie ci-dessus pour la cause réelle de l'échec"
            exit 1
          }
          Write-Host "OK : refusé sous Windows avec le message exact de la garde, exit=$LASTEXITCODE"
          exit 0
